name: trdizin-semantic-lab

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: trdizin-qdrant-50k
    restart: unless-stopped

    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: trdizin_qdrant_storage